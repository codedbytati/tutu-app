services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3002"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
      - extract

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      port: 3000
      MONGOMS_VERSION: 7.0.3

  extract:
    build:
      context: .
      dockerfile: ./microfrontends/apps/extract/Dockerfile
    ports:
      - "5001:5002"
    environment:
      NODE_ENV: development
    depends_on:
      - backend